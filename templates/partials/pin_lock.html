  <!-- Security PIN lock overlay (logic: /static/js/pin-lock.js) -->
  <div id="pin-lock-modal" style="display: {% if pin_required and not is_authenticated %}flex{% else %}none{% endif %}; position:fixed; inset:0; background:rgba(9,9,15,0.98); backdrop-filter:blur(24px); z-index:999999; align-items:center; justify-content:center; flex-direction:column; padding:20px;">
    <div style="background:#111124; border:1px solid rgba(124,58,237,0.3); border-radius:20px; padding:32px; max-width:400px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.6);">
      <div style="width:64px; height:64px; background:rgba(124,58,237,0.15); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:28px;">🔒</div>
      <h2 style="font-size:22px; font-weight:700; color:#E2E8F0; margin-bottom:8px;">Protected Access</h2>
      <p style="font-size:14px; color:#94A3B8; margin-bottom:24px;">This NetShare Hub is PIN-protected by the host. Enter the Access PIN to unlock.</p>
      <input type="password" id="pin-input" placeholder="Enter Access PIN" autocomplete="off" style="width:100%; padding:14px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); background:#18182e; color:#FFF; font-size:18px; text-align:center; letter-spacing:4px; margin-bottom:16px; outline:none;" onkeyup="if(event.key==='Enter') submitServerPin()" />
      <div id="pin-error-msg" style="color:#EF4444; font-size:13px; margin-bottom:12px; display:none;">Invalid Access PIN</div>
      <button onclick="submitServerPin()" style="width:100%; padding:14px; background:#7C3AED; color:white; border:none; border-radius:12px; font-weight:600; font-size:16px; cursor:pointer; transition:0.2s;">Unlock Hub</button>
    </div>
  </div>
  <script src="/static/js/pin-lock.js"></script>
