{% extends "base.html" %}
{% block title %}Clipboard Sync — NetShare Hub{% endblock %}
{% block page_css %}<link rel="stylesheet" href="{{ asset('css/pages/clipboard.css') }}" />{% endblock %}

{% block body %}

  <div id="toast-container"></div>

  <div class="back-bar">
    <a href="/clipboard-page" class="back-btn">← <span>All clipboards</span></a>
    <span class="back-bar-title">📋 {{ "Shared clipboard" if clip_id == "shared" else "Clipboard" }}</span>

    <div class="back-bar-spacer"></div>
    <span class="back-bar-badge">Saved · Live</span>
  </div>

  <div class="view-body">
    <div class="clipboard-body" id="clip-app" data-clip-id="{{ clip_id }}">
      <div class="sync-indicator" id="sync-indicator" data-state="connecting" role="status" aria-live="polite">
        <div class="sync-dot"></div>
        <span id="sync-text">Connecting…</span>
      </div>
      <textarea id="clipboard-box" placeholder="Type or paste text here — it syncs instantly to all connected devices on your network..."></textarea>
      <div class="clipboard-actions">
        <button class="clip-btn copy-btn" onclick="copyClipboard()">📋 Copy to Device</button>
        <button class="clip-btn clear-btn" onclick="clearClipboard()">🗑 Clear</button>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}<script src="{{ asset('js/pages/clipboard.js') }}"></script>{% endblock %}
