<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes" />
  <meta name="theme-color" content="#09090f" />
  <title>File Transfer — NetShare Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/static/icon.png" />
  <link rel="shortcut icon" type="image/png" href="/static/icon.png" />
  <link rel="stylesheet" href="/static/style.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090f; --bg2: #0d0d18; --card: #111124; --card2: #18182e; --card3: #1e1e38;
      --accent: #7C3AED; --accent2: #A855F7; --accent3: #C084FC;
      --green: #10B981; --amber: #F59E0B; --red: #EF4444; --blue: #3B82F6; --cyan: #06B6D4;
      --text: #E2E8F0; --text2: #CBD5E1; --muted: #64748B;
      --border: rgba(124, 58, 237, 0.2); --border2: rgba(255, 255, 255, 0.06);
      --r: 16px; --font: 'Inter', system-ui, sans-serif;
    }
    html, body { height: 100%; width: 100%; background: var(--bg2); color: var(--text); font-family: var(--font); overflow: hidden; display: flex; flex-direction: column; }

    /* Back Bar */
    .back-bar {
      display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 52px;
      background: rgba(9, 9, 15, .9); border-bottom: 1px solid var(--border2);
      backdrop-filter: blur(12px); flex-shrink: 0; z-index: 30;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 9px;
      background: var(--card2); border: 1px solid var(--border2); color: var(--text2);
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.18s; text-decoration: none;
    }
    .back-btn:hover { background: var(--card3); border-color: rgba(124, 58, 237, .4); color: var(--accent2); }
    .back-bar-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .back-bar-spacer { flex: 1; }
    .back-bar-badge { font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 100px; background: rgba(16, 185, 129, .15); color: var(--green); border: 1px solid rgba(16, 185, 129, .3); }

    /* View Body */
    .view-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .files-top { padding: 20px 24px 14px; flex-shrink: 0; }
    #drop-zone {
      border: 2px dashed rgba(16, 185, 129, .35); border-radius: 14px; background: rgba(16, 185, 129, .04);
      padding: 24px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; cursor: pointer; transition: all 0.2s;
    }
    #drop-zone:hover, #drop-zone.drag-over { border-color: var(--green); background: rgba(16, 185, 129, .1); }
    .dz-icon { font-size: 34px; }
    .dz-text { font-size: 14px; font-weight: 600; color: var(--text2); }
    .dz-sub { font-size: 12px; color: var(--muted); }
    #choose-file-btn { padding: 8px 20px; border: 1px solid rgba(16, 185, 129, .4); border-radius: 8px; background: rgba(16, 185, 129, .12); color: var(--green); font-size: 13px; font-weight: 600; cursor: pointer; }

    #upload-queue { padding: 0 24px; flex-shrink: 0; display: none; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    #upload-queue.active { display: flex; }
    .batch-panel { background: linear-gradient(135deg, rgba(24, 24, 46, 0.95), rgba(17, 17, 36, 0.95)); border: 1px solid rgba(124, 58, 237, 0.35); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .batch-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .batch-title-wrap { display: flex; align-items: center; gap: 8px; }
    .batch-spinner { width: 15px; height: 15px; border: 2px solid rgba(16, 185, 129, 0.3); border-top-color: var(--green); border-radius: 50%; animation: batchSpin 0.8s linear infinite; }
    @keyframes batchSpin { to { transform: rotate(360deg); } }
    .batch-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .batch-badges { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .batch-badge { padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    .batch-badge.success { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .batch-badge.queued { background: rgba(124, 58, 237, 0.15); color: var(--accent2); }
    .batch-badge.failed { background: rgba(239, 68, 68, 0.15); color: var(--red); }
    .batch-cancel-btn { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--red); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .batch-cancel-btn:hover { background: rgba(239, 68, 68, 0.25); }
    .batch-progress-track { height: 6px; background: var(--card3); border-radius: 3px; overflow: hidden; position: relative; }
    .batch-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--green), #34D399, var(--accent2)); transition: width 0.25s ease-out; }
    .batch-subtext { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .active-items-list { display: flex; flex-direction: column; gap: 6px; max-height: 120px; overflow-y: auto; }
    .upload-item { background: rgba(24, 24, 46, 0.85); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 12px; display: flex; flex-direction: column; gap: 4px; animation: itemFade 0.2s ease; }
    @keyframes itemFade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .upload-item-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .upload-item-name { font-weight: 600; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
    .upload-item-pct { font-size: 11px; font-weight: 600; color: var(--green); }
    .progress-track { height: 4px; background: var(--card3); border-radius: 2px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--green), #34D399); transition: width 0.15s linear; }

    .file-toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 24px; flex-shrink: 0; border-top: 1px solid var(--border2); border-bottom: 1px solid var(--border2); }
    #file-search { flex: 1; background: var(--card2); border: 1px solid var(--border2); border-radius: 9px; padding: 8px 14px; color: var(--text); font-size: 13px; outline: none; }
    .toolbar-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid; font-size: 12px; font-weight: 600; cursor: pointer; display: none; }
    .toolbar-btn.dl-multi { background: rgba(16, 185, 129, .1); color: var(--green); border-color: rgba(16, 185, 129, .3); }
    .toolbar-btn.del-multi { background: rgba(239, 68, 68, .1); color: var(--red); border-color: rgba(239, 68, 68, .3); }

    #file-list-wrap { flex: 1; overflow-y: auto; padding: 16px 24px 30px; }

    /* Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .85); backdrop-filter: blur(12px); z-index: 99999 !important; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex !important; }
    .modal-box { background: var(--card2); border: 1px solid var(--border); border-radius: 20px; padding: 28px 30px; width: 340px; }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn { width: 100%; padding: 13px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid; }
    .modal-btn.primary { background: rgba(124, 58, 237, .2); color: var(--accent2); border-color: rgba(124, 58, 237, .5); }
    .modal-btn.secondary { background: rgba(59, 130, 246, .15); color: var(--blue); border-color: rgba(59, 130, 246, .35); }
    .modal-btn.neutral { background: rgba(255, 255, 255, .05); color: var(--muted); border-color: var(--border2); }
    .modal-close-x { float: right; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }

    .preview-modal-box { background: var(--card2); border: 1px solid var(--border); border-radius: 20px; padding: 24px; width: min(720px, 92vw); max-height: 88vh; display: flex; flex-direction: column; gap: 16px; }
    .preview-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border2); padding-bottom: 12px; }
    .preview-filename { font-size: 16px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85%; }
    .preview-body { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 200px; max-height: 60vh; overflow: hidden; background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 12px; }
    .preview-body img, .preview-body video { max-width: 100%; max-height: 55vh; object-fit: contain; border-radius: 8px; }

    #toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .toast { padding: 10px 22px; border-radius: 100px; font-size: 13px; font-weight: 600; backdrop-filter: blur(14px); white-space: nowrap; }
    .toast.success { background: rgba(16, 185, 129, .22); color: var(--green); border: 1px solid rgba(16, 185, 129, .4); }
    .toast.error { background: rgba(239, 68, 68, .22); color: var(--red); border: 1px solid rgba(239, 68, 68, .4); }
    .toast.info { background: rgba(124, 58, 237, .22); color: var(--accent2); border: 1px solid rgba(124, 58, 237, .4); }
  </style>
</head>

<body>

  <div id="toast-container"></div>

  <!-- Download modal -->
  <div class="modal-overlay" id="download-modal">
    <div class="modal-box">
      <button class="modal-close-x" onclick="closeDownloadModal()">✕</button>
      <div class="modal-title">📦 Download Options</div>
      <div class="modal-sub">Choose how to download the selected files</div>
      <div class="modal-actions">
        <button class="modal-btn primary" onclick="chooseZip()">📦 Download as ZIP archive</button>
        <button class="modal-btn secondary" onclick="chooseIndividual()">📂 Download files individually</button>
        <button class="modal-btn neutral" onclick="closeDownloadModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Media Preview Lightbox Modal -->
  <div id="preview-modal" class="modal-overlay" onclick="closePreviewModal(event)">
    <div class="preview-modal-box" onclick="event.stopPropagation()">
      <div class="preview-header">
        <span class="preview-filename" id="preview-filename-text">File Preview</span>
        <button class="modal-close-x" onclick="closePreviewModal()">&times;</button>
      </div>
      <div class="preview-body" id="preview-body-content"></div>
      <div style="display:flex;gap:12px;justify-content:flex-end;">
        <a id="preview-download-btn" href="#" class="modal-btn primary" style="text-align:center;text-decoration:none;">⬇ Download File</a>
        <button class="modal-btn neutral" onclick="closePreviewModal()">Close</button>
      </div>
    </div>
  </div>

  <div class="back-bar">
    <a href="/" class="back-btn">← <span>Home</span></a>
    <span class="back-bar-title">📁 File Transfer</span>

    <div class="back-bar-spacer"></div>
    <span class="back-bar-badge" id="file-count-badge">0 files</span>
  </div>

  <div class="view-body">
    <div class="files-top">
      <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="dz-icon">☁️</div>
        <div class="dz-text">Drop files here or click to choose</div>
        <div class="dz-sub">All file types · Multiple files at once</div>
        <button id="choose-file-btn" onclick="event.stopPropagation();document.getElementById('file-input').click()">Choose Files</button>
        <input type="file" id="file-input" multiple hidden>
      </div>
    </div>

    <div id="upload-queue"></div>

    <div class="file-toolbar">
      <input type="text" id="file-search" placeholder="🔍  Search files..." oninput="filterFiles()">
      <button class="toolbar-btn dl-multi" id="dl-multi-btn" onclick="openDownloadModal()">⬇ Download</button>
      <button class="toolbar-btn del-multi" id="del-multi-btn" onclick="deleteSelected()">🗑 Delete</button>
    </div>

    <div id="file-list-wrap">
      <div id="file-list-container">
        <p style="color:var(--muted);text-align:center;padding:50px 0;font-size:14px">Loading files...</p>
      </div>
    </div>
  </div>

  <!-- Security PIN Modal Overlay -->
  <div id="pin-lock-modal" style="display: {% if pin_required and not is_authenticated %}flex{% else %}none{% endif %}; position:fixed; inset:0; background:rgba(9,9,15,0.98); backdrop-filter:blur(24px); z-index:999999; align-items:center; justify-content:center; flex-direction:column; padding:20px;">
    <div style="background:#111124; border:1px solid rgba(124,58,237,0.3); border-radius:20px; padding:32px; max-width:400px; width:100%; text-align:center;">
      <div style="width:64px; height:64px; background:rgba(124,58,237,0.15); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:28px;">🔒</div>
      <h2 style="font-size:22px; font-weight:700; color:#E2E8F0; margin-bottom:8px;">Protected Access</h2>
      <p style="font-size:14px; color:#94A3B8; margin-bottom:24px;">Enter Access PIN to unlock.</p>
      <input type="password" id="pin-input" placeholder="Enter Access PIN" style="width:100%; padding:14px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); background:#18182e; color:#FFF; font-size:18px; text-align:center; margin-bottom:16px; outline:none;" onkeyup="if(event.key==='Enter') submitServerPin()" />
      <div id="pin-error-msg" style="color:#EF4444; font-size:13px; margin-bottom:12px; display:none;">Invalid Access PIN</div>
      <button onclick="submitServerPin()" style="width:100%; padding:14px; background:#7C3AED; color:white; border:none; border-radius:12px; font-weight:600; font-size:16px; cursor:pointer;">Unlock Hub</button>
    </div>
  </div>

  <script>
    const _origFetch = window.fetch;
    window.fetch = function(url, options = {}) {
      options = options || {}; options.headers = options.headers || {};
      const token = localStorage.getItem("pin_token");
      if (token) {
        if (options.headers instanceof Headers) options.headers.append("X-Server-PIN-Token", token);
        else options.headers["X-Server-PIN-Token"] = token;
      }
      return _origFetch.call(this, url, options);
    };

    async function checkPinStatus() {
      try {
        const savedToken = localStorage.getItem("pin_token") || "";
        const res = await _origFetch("/api/auth/status", { headers: savedToken ? { "X-Server-PIN-Token": savedToken } : {} });
        const data = await res.json();
        if (data.is_blocked) { window.location.reload(); return false; }
        const modal = document.getElementById("pin-lock-modal");
        if (data.pin_required && !data.is_authenticated) { if (modal) modal.style.display = "flex"; return false; }
        else { if (modal) modal.style.display = "none"; return true; }
      } catch (e) { return true; }
    }

    async function submitServerPin() {
      const pin = document.getElementById("pin-input").value.trim();
      const errorEl = document.getElementById("pin-error-msg");
      if (!pin) return;
      try {
        const res = await _origFetch("/api/auth/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) });
        const data = await res.json();
        if (res.ok && data.status === "ok") {
          if (data.token) { localStorage.setItem("pin_token", data.token); document.cookie = "pin_token=" + data.token + "; path=/; max-age=864000"; }
          document.getElementById("pin-lock-modal").style.display = "none";
          window.location.reload();
        } else if (errorEl) { errorEl.textContent = data.error || "Invalid Access PIN"; errorEl.style.display = "block"; }
      } catch (e) { if (errorEl) { errorEl.textContent = "Failed to verify PIN."; errorEl.style.display = "block"; } }
    }

    function showToast(msg, type = 'success', duration = 2600) {
      const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), duration);
    }

    let selectedFilesForModal = [];

    function handlePreviewClick(el) {
      if (!el) return;
      const fn = el.getAttribute('data-filename');
      const ft = el.getAttribute('data-ftype');
      if (fn) previewMedia(fn, ft || 'other');
    }

    function handleDeleteClick(el) {
      if (!el) return;
      const fn = el.getAttribute('data-filename');
      if (fn) deleteFile(fn);
    }

    function previewMedia(filename, type) {
      const modal = document.getElementById('preview-modal');
      const title = document.getElementById('preview-filename-text');
      const body = document.getElementById('preview-body-content');
      const dlBtn = document.getElementById('preview-download-btn');
      if (!modal || !body) return;
      title.textContent = filename;
      dlBtn.href = '/download/' + encodeURIComponent(filename);
      const fileUrl = '/file-preview/' + encodeURIComponent(filename);
      if (type === 'image') body.innerHTML = `<img src="${fileUrl}" alt="${filename}" loading="lazy"/>`;
      else if (type === 'video') body.innerHTML = `<video src="${fileUrl}" controls autoplay style="width:100%;max-height:55vh;"></video>`;
      else if (type === 'audio') body.innerHTML = `<div style="text-align:center;width:100%;padding:30px;"><div style="font-size:48px;margin-bottom:16px;">🎵</div><audio src="${fileUrl}" controls autoplay style="width:100%;max-width:480px;"></audio></div>`;
      else body.innerHTML = `<div style="text-align:center;padding:40px;"><div style="font-size:56px;margin-bottom:12px;">📄</div><div style="font-size:15px;color:var(--text2);margin-bottom:8px;">${filename}</div></div>`;
      modal.classList.add('show');
    }

    function closePreviewModal(e) {
      if (e && e.target && !e.target.classList.contains('modal-overlay') && !e.target.classList.contains('modal-close-x') && e.target.tagName !== 'BUTTON') return;
      const modal = document.getElementById('preview-modal');
      if (modal) { modal.classList.remove('show'); const body = document.getElementById('preview-body-content'); if (body) body.innerHTML = ''; }
    }

    async function loadFiles() {
      try {
        const html = await (await fetch('/files')).text();
        document.getElementById('file-list-container').innerHTML = html;
        document.querySelectorAll('.dl-btn').forEach(btn => {
          const f = btn.getAttribute('href').replace('/download/', '');
          btn.href = '/download/' + encodeURIComponent(decodeURIComponent(f));
        });
        const rows = document.querySelectorAll('.file-row');
        document.getElementById('file-count-badge').textContent = rows.length + (rows.length === 1 ? ' file' : ' files');
      } catch (e) {
        document.getElementById('file-list-container').innerHTML = '<p style="color:var(--red);text-align:center;padding:50px 0">Failed to load files</p>';
      }
    }

    function filterFiles() {
      const q = document.getElementById('file-search').value.toLowerCase();
      document.querySelectorAll('.file-row').forEach(row => {
        const name = (row.querySelector('.file-name-text')?.textContent || '').toLowerCase();
        row.style.display = name.includes(q) ? '' : 'none';
      });
    }

    function updateBulkActions() {
      const n = document.querySelectorAll('.file-checkbox:checked').length;
      document.getElementById('dl-multi-btn').style.display = n ? 'inline-flex' : 'none';
      document.getElementById('del-multi-btn').style.display = n ? 'inline-flex' : 'none';
    }

    function toggleAll(src) {
      document.querySelectorAll('.file-checkbox').forEach(c => c.checked = src.checked);
      updateBulkActions();
    }

    async function deleteFile(filename) {
      if (!confirm('Delete "' + filename + '"?')) return;
      const r = await fetch('/delete/' + encodeURIComponent(filename), { method: 'DELETE' });
      r.ok ? (showToast('🗑 Deleted'), loadFiles()) : showToast('❌ Delete failed', 'error');
    }

    async function deleteSelected() {
      const sel = Array.from(document.querySelectorAll('.file-checkbox:checked')).map(c => c.value);
      if (!sel.length) return;
      if (!confirm(`Delete ${sel.length} file(s)?`)) return;
      let errs = 0;
      for (const f of sel) { const r = await fetch('/delete/' + encodeURIComponent(f), { method: 'DELETE' }); if (!r.ok) errs++; }
      showToast(errs ? `❌ ${errs} failed` : `🗑 Deleted ${sel.length} file(s)`, errs ? 'error' : 'success');
      loadFiles();
    }

    function openDownloadModal() {
      const sel = Array.from(document.querySelectorAll('.file-checkbox:checked')).map(c => c.value);
      if (!sel.length) { showToast('Select files first', 'info'); return; }
      selectedFilesForModal = sel; document.getElementById('download-modal').classList.add('show');
    }
    function closeDownloadModal() { document.getElementById('download-modal').classList.remove('show'); }
    function chooseZip() { closeDownloadModal(); downloadAsZip(selectedFilesForModal); }
    function chooseIndividual() { closeDownloadModal(); downloadIndividually(selectedFilesForModal); }

    async function downloadAsZip(files) {
      showToast('📦 Preparing ZIP...', 'info');
      const res = await fetch('/download-multiple', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ files }) });
      const blob = await res.blob(); const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'files.zip'; a.click(); URL.revokeObjectURL(url); showToast('✅ ZIP downloaded');
    }

    function downloadIndividually(files) {
      files.forEach((f, i) => setTimeout(() => {
        const a = document.createElement('a'); a.href = '/download/' + encodeURIComponent(f); a.download = f;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }, i * 350));
      showToast(`⬇ Downloading ${files.length} file(s)`);
    }

    // ── High Performance Concurrency Upload Engine (Supports 300+ files) ──
    const MAX_CONCURRENT_UPLOADS = 3;
    let uploadQueue = [];
    let activeUploads = 0;
    const activeXHRs = new Map();
    let uploadTaskId = 0;
    
    // Batch Metrics
    let batchTotalCount = 0;
    let batchCompletedCount = 0;
    let batchFailedCount = 0;
    let batchTotalBytes = 0;
    let batchUploadedBytes = 0;
    let isBatchActive = false;
    let batchFadeTimer = null;
    let debouncedReloadTimer = null;

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const k = 1024, dm = 1;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function initUpload() {
      const zone = document.getElementById('drop-zone'), input = document.getElementById('file-input');
      if (!zone || !input) return;
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files) uploadFiles(e.dataTransfer.files);
      });
      input.addEventListener('change', () => {
        if (input.files && input.files.length) uploadFiles(input.files);
        input.value = '';
      });
    }

    function uploadFiles(fileList) {
      const files = Array.from(fileList);
      if (!files.length) return;

      if (batchFadeTimer) { clearTimeout(batchFadeTimer); batchFadeTimer = null; }

      // If previous batch was completed and idle, reset counters
      if (!isBatchActive && uploadQueue.length === 0 && activeUploads === 0) {
        batchTotalCount = 0;
        batchCompletedCount = 0;
        batchFailedCount = 0;
        batchTotalBytes = 0;
        batchUploadedBytes = 0;
      }

      isBatchActive = true;

      for (const file of files) {
        const id = ++uploadTaskId;
        const task = {
          id: id,
          file: file,
          name: file.name,
          size: file.size || 0,
          loaded: 0,
          status: 'queued',
          retryCount: 0
        };
        uploadQueue.push(task);
        batchTotalCount++;
        batchTotalBytes += (file.size || 0);
      }

      renderBatchContainer();
      updateBatchUI();
      pumpUploadQueue();
    }

    function renderBatchContainer() {
      const container = document.getElementById('upload-queue');
      if (!container) return;
      container.classList.add('active');

      if (!document.getElementById('batch-panel-wrap')) {
        container.innerHTML = `
          <div class="batch-panel" id="batch-panel-wrap">
            <div class="batch-header">
              <div class="batch-title-wrap">
                <div class="batch-spinner" id="batch-spinner-el"></div>
                <div class="batch-title" id="batch-title-el">Preparing upload...</div>
              </div>
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="batch-badges">
                  <span class="batch-badge success" id="badge-completed">0 done</span>
                  <span class="batch-badge queued" id="badge-queued">0 queued</span>
                  <span class="batch-badge failed" id="badge-failed" style="display:none;">0 failed</span>
                </div>
                <button type="button" class="batch-cancel-btn" id="batch-cancel-btn" onclick="cancelAllUploads()">Cancel All</button>
              </div>
            </div>
            <div class="batch-progress-track">
              <div class="batch-progress-bar" id="batch-progress-bar"></div>
            </div>
            <div class="batch-subtext">
              <span id="batch-bytes-text">0 B / 0 B</span>
              <span id="batch-pct-text">0%</span>
            </div>
            <div class="active-items-list" id="active-items-list"></div>
          </div>
        `;
      }
    }

    function updateBatchUI() {
      const titleEl = document.getElementById('batch-title-el');
      const queuedEl = document.getElementById('badge-queued');
      const compEl = document.getElementById('badge-completed');
      const failEl = document.getElementById('badge-failed');
      const barEl = document.getElementById('batch-progress-bar');
      const bytesEl = document.getElementById('batch-bytes-text');
      const pctEl = document.getElementById('batch-pct-text');
      const spinnerEl = document.getElementById('batch-spinner-el');
      const cancelBtn = document.getElementById('batch-cancel-btn');

      if (!titleEl) return;

      const remainingInQueue = uploadQueue.length;
      const inFlight = activeUploads;
      const finished = batchCompletedCount + batchFailedCount;

      if (remainingInQueue === 0 && inFlight === 0) {
        if (spinnerEl) spinnerEl.style.display = 'none';
        if (cancelBtn) cancelBtn.style.display = 'none';
        if (batchFailedCount === 0) {
          titleEl.textContent = `🎉 Successfully uploaded all ${batchCompletedCount} file${batchCompletedCount === 1 ? '' : 's'}!`;
          if (barEl) { barEl.style.width = '100%'; barEl.style.background = 'var(--green)'; }
          if (pctEl) pctEl.textContent = '100%';
        } else {
          titleEl.textContent = `Completed: ${batchCompletedCount} uploaded, ${batchFailedCount} failed`;
          if (pctEl) pctEl.textContent = 'Finished';
        }
      } else {
        if (spinnerEl) spinnerEl.style.display = 'block';
        if (cancelBtn) cancelBtn.style.display = 'inline-block';
        titleEl.textContent = `Uploading batch: ${finished + 1} of ${batchTotalCount} files (${inFlight} active)`;

        let overallPct = 0;
        if (batchTotalBytes > 0) {
          overallPct = Math.min(99, Math.round((batchUploadedBytes / batchTotalBytes) * 100));
        } else if (batchTotalCount > 0) {
          overallPct = Math.min(99, Math.round((finished / batchTotalCount) * 100));
        }

        if (barEl) barEl.style.width = overallPct + '%';
        if (pctEl) pctEl.textContent = overallPct + '%';
      }

      if (queuedEl) queuedEl.textContent = `${remainingInQueue} queued`;
      if (compEl) compEl.textContent = `${batchCompletedCount} done`;
      if (failEl) {
        if (batchFailedCount > 0) {
          failEl.style.display = 'inline-block';
          failEl.textContent = `${batchFailedCount} failed`;
        } else {
          failEl.style.display = 'none';
        }
      }

      if (bytesEl) {
        bytesEl.textContent = `${formatBytes(batchUploadedBytes)} / ${formatBytes(batchTotalBytes)}`;
      }
    }

    function pumpUploadQueue() {
      while (activeUploads < MAX_CONCURRENT_UPLOADS && uploadQueue.length > 0) {
        const task = uploadQueue.shift();
        activeUploads++;
        startSingleUpload(task);
      }
      updateBatchUI();
    }

    function startSingleUpload(task) {
      task.status = 'uploading';
      const activeList = document.getElementById('active-items-list');

      let itemEl = document.getElementById(`up-task-${task.id}`);
      if (!itemEl && activeList) {
        itemEl = document.createElement('div');
        itemEl.className = 'upload-item';
        itemEl.id = `up-task-${task.id}`;
        itemEl.innerHTML = `
          <div class="upload-item-top">
            <span class="upload-item-name" title="${task.name}">📄 ${task.name}</span>
            <span class="upload-item-pct" id="up-pct-${task.id}">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-bar" id="up-pb-${task.id}"></div>
          </div>
        `;
        activeList.appendChild(itemEl);
      }

      const xhr = new XMLHttpRequest();
      const fd = new FormData();
      fd.append('file', task.file);

      let lastLoadedForTask = 0;

      xhr.upload.addEventListener('progress', e => {
        if (e.lengthComputable) {
          const delta = e.loaded - lastLoadedForTask;
          lastLoadedForTask = e.loaded;
          batchUploadedBytes += delta;

          const pct = Math.min(100, Math.round((e.loaded / e.total) * 100));
          const pb = document.getElementById(`up-pb-${task.id}`);
          const pTxt = document.getElementById(`up-pct-${task.id}`);
          if (pb) pb.style.width = pct + '%';
          if (pTxt) pTxt.textContent = pct + '%';
          updateBatchUI();
        }
      });

      const onFinish = (isSuccess) => {
        activeXHRs.delete(task.id);
        activeUploads--;

        const remainingBytes = task.size - lastLoadedForTask;
        if (isSuccess && remainingBytes > 0) {
          batchUploadedBytes += remainingBytes;
        }

        const el = document.getElementById(`up-task-${task.id}`);
        if (el) {
          if (isSuccess) {
            const pTxt = document.getElementById(`up-pct-${task.id}`);
            if (pTxt) { pTxt.textContent = '✅'; pTxt.style.color = 'var(--green)'; }
            setTimeout(() => { if (el && el.parentNode) el.remove(); }, 600);
          } else {
            const pTxt = document.getElementById(`up-pct-${task.id}`);
            if (pTxt) { pTxt.textContent = '❌ Failed'; pTxt.style.color = 'var(--red)'; }
            setTimeout(() => { if (el && el.parentNode) el.remove(); }, 2000);
          }
        }

        if (isSuccess) {
          batchCompletedCount++;
          debouncedLoadFiles(1200);
        } else {
          batchFailedCount++;
        }

        checkBatchCompleted();
        pumpUploadQueue();
      };

      xhr.onload = () => {
        if (xhr.status === 200) {
          onFinish(true);
        } else {
          if (task.retryCount < 1) {
            task.retryCount++;
            activeXHRs.delete(task.id);
            activeUploads--;
            uploadQueue.unshift(task);
            const el = document.getElementById(`up-task-${task.id}`);
            if (el) el.remove();
            setTimeout(pumpUploadQueue, 800);
          } else {
            onFinish(false);
          }
        }
      };

      xhr.onerror = () => {
        if (task.retryCount < 1) {
          task.retryCount++;
          activeXHRs.delete(task.id);
          activeUploads--;
          uploadQueue.unshift(task);
          const el = document.getElementById(`up-task-${task.id}`);
          if (el) el.remove();
          setTimeout(pumpUploadQueue, 800);
        } else {
          onFinish(false);
        }
      };

      xhr.ontimeout = () => {
        onFinish(false);
      };

      xhr.open('POST', '/upload');
      const savedToken = localStorage.getItem("pin_token");
      if (savedToken) {
        xhr.setRequestHeader('X-Server-PIN-Token', savedToken);
      }
      xhr.timeout = 300000;
      activeXHRs.set(task.id, xhr);
      xhr.send(fd);
    }

    function checkBatchCompleted() {
      if (uploadQueue.length === 0 && activeUploads === 0 && isBatchActive) {
        isBatchActive = false;
        batchUploadedBytes = batchTotalBytes;
        updateBatchUI();

        loadFiles();

        if (batchFailedCount === 0) {
          showToast(`✅ All ${batchCompletedCount} files uploaded successfully!`, 'success', 3500);
        } else {
          showToast(`⚠️ ${batchCompletedCount} uploaded, ${batchFailedCount} failed`, 'error', 4000);
        }

        batchFadeTimer = setTimeout(() => {
          const container = document.getElementById('upload-queue');
          if (container && !isBatchActive && uploadQueue.length === 0 && activeUploads === 0) {
            container.innerHTML = '';
            container.classList.remove('active');
          }
        }, 5000);
      }
    }

    function cancelAllUploads() {
      activeXHRs.forEach(xhr => {
        try { xhr.abort(); } catch (e) {}
      });
      activeXHRs.clear();
      uploadQueue = [];
      activeUploads = 0;
      isBatchActive = false;

      const container = document.getElementById('upload-queue');
      if (container) {
        container.innerHTML = '';
        container.classList.remove('active');
      }
      showToast('🛑 Upload cancelled', 'info');
      loadFiles();
    }

    function debouncedLoadFiles(delay = 1200) {
      if (debouncedReloadTimer) return;
      debouncedReloadTimer = setTimeout(() => {
        debouncedReloadTimer = null;
        loadFiles();
      }, delay);
    }

    (function init() {
      checkPinStatus(); initUpload(); loadFiles();
      const es = new EventSource('/events');
      es.onmessage = e => {
        // Suppress SSE table reloads during an active batch upload to avoid DOM stutter
        if (e.data === 'update' && !isBatchActive) loadFiles();
      };
    })();
  </script>
</body>

</html>
