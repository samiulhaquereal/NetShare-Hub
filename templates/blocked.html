<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied — RetCore OnLAN</title>
  <link rel="icon" type="image/png" href="{{ asset('icons/favicon-32.png') }}" />
  <link rel="stylesheet" href="{{ asset('css/fonts.css') }}" />
  <link rel="stylesheet" href="{{ asset('css/pages/blocked.css') }}" />
</head>
<body>
  <div class="blocked-card">
    <div class="icon-wrap">🚫</div>
    <h1>Access Denied</h1>
    <p class="subtitle">Your IP address has been blocked by the host administrator. You cannot access RetCore OnLAN resources from this device.</p>
    
    <div class="meta-box">
      <div class="meta-row">
        <span class="meta-label">Your IP Address</span>
        <span class="meta-val ip-highlight">{{ ip }}</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Access Status</span>
        <span class="meta-val" style="color:#EF4444;">403 Blocked</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Timestamp</span>
        <span class="meta-val">{{ server_time }}</span>
      </div>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">
      🔄 Check Access Again
    </button>

    <div class="brand-footer">RetCore OnLAN Security</div>
  </div>
</body>
</html>
