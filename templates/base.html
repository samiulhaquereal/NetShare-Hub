<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="{% block viewport %}width=device-width,initial-scale=1,user-scalable=yes{% endblock %}" />
  <meta name="theme-color" content="#09090f" />
  {% block meta %}{% endblock %}
  <title>{% block title %}RetCore OnLAN{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ asset('icons/favicon-32.png') }}" />
  <link rel="apple-touch-icon" href="{{ asset('icons/apple-touch-180.png') }}" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Self-hosted fonts: no third-party request, works on LANs without internet. -->
  <link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="{{ asset('css/fonts.css') }}" />
  <!-- Shared styles first, then the page's own stylesheet (it may override). -->
  <link rel="stylesheet" href="{{ asset('css/base.css') }}" />
  {% block layout_css %}<link rel="stylesheet" href="{{ asset('css/hub.css') }}" />{% endblock %}
  {% block page_css %}{% endblock %}
</head>

<body>
{% block body %}{% endblock %}

  {% include "partials/pin_lock.html" %}
  <script>
    // Server-provided settings for the page scripts.
    window.NSH = {{ {"httpUrl": http_url, "wsUrl": ws_url, "httpsPort": https_port or 0} | tojson }};
  </script>
  <script src="{{ asset('js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
