name: Build NetShare Hub Executables

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Ensure Ngrok Binary for Windows
        run: |
          python -c "import os, shutil; from pyngrok import conf, installer; p = conf.get_default().ngrok_path; installer.install_ngrok(p); shutil.copy(p, 'ngrok.exe') if not os.path.exists('ngrok.exe') else None"

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onefile --noconsole --icon "icon.ico" --add-data "templates;templates" --add-data "static;static" --add-binary "ngrok.exe;." --name "NetShare-Hub-Windows" server.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetShare-Hub-Windows
          path: dist/NetShare-Hub-Windows.exe

  build-linux:
    name: Build Linux Executable (Binary)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            python3-tk \
            python3-dev \
            libx11-dev \
            wget

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Prepare Linux Requirements & Ensure Ngrok Binary
        run: |
          # Filter out Windows-specific packages
          grep -v -E "pywin32|pyaudiowpatch" requirements.txt > requirements-linux.txt
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt
          pip install pyinstaller

          # Download and install official ngrok binary for Linux via pyngrok
          python -c "import os, shutil; from pyngrok import conf, installer; p = conf.get_default().ngrok_path; installer.install_ngrok(p); shutil.copy(p, 'ngrok') if not os.path.exists('ngrok') else None"
          chmod +x ngrok

      - name: Build Linux Executable
        run: |
          pyinstaller --noconfirm --onefile --noconsole --icon "static/icon.png" --add-data "templates:templates" --add-data "static:static" --add-binary "ngrok:." --name "NetShare-Hub-Linux" server.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetShare-Hub-Linux
          path: dist/NetShare-Hub-Linux

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NetShare-Hub-Windows
          path: ./release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: NetShare-Hub-Linux
          path: ./release-assets

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./release-assets/*"
          tag: "latest"
          name: "NetShare Hub Latest Release"
          body: |
            ## 🌐 NetShare Hub - Continuous Build Release
            Automatically built executable binaries for Windows and Linux.
            
            ### 📦 Downloads:
            - **Windows**: `NetShare-Hub-Windows.exe`
            - **Linux (Ubuntu)**: `NetShare-Hub-Linux`
          allowUpdates: true
          recreateRelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
