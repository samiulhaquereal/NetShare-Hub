name: CI & Release

# PR into main  -> test + build + Linux compatibility check (artifacts only)
# merge to main -> the same, then publish the "latest" GitHub Release
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Linux desktop for tests (X11 + window manager + PulseAudio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            libgl1 libglib2.0-0 xvfb openbox pulseaudio pulseaudio-utils
          Xvfb :99 -screen 0 1600x900x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1 && DISPLAY=:99 openbox &
          pulseaudio -D --exit-idle-time=-1 || echo "::warning::PulseAudio unavailable (audio tests use fakes)"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  build-windows:
    name: Build RetCore-OnLAN-Windows
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Cache ngrok binary
        id: ngrok-cache
        uses: actions/cache@v6
        with:
          path: ngrok.exe
          key: ngrok-v3-windows

      - name: Download ngrok binary
        if: steps.ngrok-cache.outputs.cache-hit != 'true'
        run: python -c "import shutil; from pyngrok import conf, installer; p = conf.get_default().ngrok_path; installer.install_ngrok(p); shutil.copy(p, 'ngrok.exe')"

      # Build number + commit inside the app: the in-app updater compares them with version.json
      - name: Stamp build info
        run: python tools/write_build_info.py ${{ github.run_number }} ${{ github.sha }}

      - name: Build executable
        run: >
          pyinstaller --noconfirm --onefile --noconsole --log-level WARN --icon icon.ico --collect-data customtkinter
          --hidden-import netshare._build_info
          --add-data "templates;templates" --add-data "static;static" --add-binary "ngrok.exe;."
          --name RetCore-OnLAN-Windows server.py

      # Starts the frozen app, renders every page from the bundled templates and
      # exits non-zero if anything (imports, templates, static files) is missing.
      - name: Smoke-test executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/RetCore-OnLAN-Windows.exe" -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--check failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v7
        with:
          name: RetCore-OnLAN-Windows
          path: dist/RetCore-OnLAN-Windows.exe
          if-no-files-found: error
          retention-days: 14

  # PyInstaller bundles the build machine's system libraries (glibc, glib …), so a
  # binary only runs on distros at least as new as the builder. Building inside
  # Ubuntu 22.04 (glibc 2.35) makes it run on Ubuntu 22.04 / 24.04+ and Debian 12+,
  # instead of only on whatever `ubuntu-latest` currently is.
  build-linux:
    name: Build RetCore-OnLAN-Linux
    needs: test
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build toolchain
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            python3 python3-venv python3-dev python3-tk libgl1 libglib2.0-0 binutils git ca-certificates

      - uses: actions/checkout@v7

      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-ubuntu2204-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install -q --upgrade pip
          /opt/venv/bin/pip install -q -r requirements.txt pyinstaller
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Cache ngrok binary
        id: ngrok-cache
        uses: actions/cache@v6
        with:
          path: ngrok
          key: ngrok-v3-linux

      - name: Download ngrok binary
        if: steps.ngrok-cache.outputs.cache-hit != 'true'
        run: |
          python -c "import shutil; from pyngrok import conf, installer; p = conf.get_default().ngrok_path; installer.install_ngrok(p); shutil.copy(p, 'ngrok')"
          chmod +x ngrok

      - name: Stamp build info
        run: python tools/write_build_info.py ${{ github.run_number }} ${{ github.sha }}

      - name: Build executable
        run: >
          pyinstaller --noconfirm --onefile --noconsole --log-level WARN --collect-submodules Xlib --collect-data customtkinter
          --hidden-import netshare._build_info
          --add-data "templates:templates" --add-data "static:static" --add-binary "ngrok:."
          --name RetCore-OnLAN-Linux server.py

      - name: Smoke-test & package executable
        run: |
          ./dist/RetCore-OnLAN-Linux --check
          # tar keeps the executable bit (plain artifact/release downloads lose it)
          tar -czf dist/RetCore-OnLAN-Linux.tar.gz -C dist RetCore-OnLAN-Linux

      - uses: actions/upload-artifact@v7
        with:
          name: RetCore-OnLAN-Linux
          path: dist/RetCore-OnLAN-Linux.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Prove the Linux binary starts on clean installs of the distros we support.
  linux-compat:
    name: Linux binary on ${{ matrix.image }}
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: RetCore-OnLAN-Linux

      - name: Run --check on a clean system (no Python installed)
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends libgl1 libglib2.0-0
          tar -xzf RetCore-OnLAN-Linux.tar.gz
          ./RetCore-OnLAN-Linux --check

  release:
    name: Publish "latest" release
    needs: [build-windows, build-linux, linux-compat]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      # version.json: build number + SHA-256/size of each file, read by the in-app updater
      - name: Write update manifest
        run: python3 tools/write_manifest.py release-assets ${{ github.run_number }} ${{ github.sha }}

      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          ## 🌐 RetCore OnLAN — continuous build

          Build **#${{ github.run_number }}** from commit \`${GITHUB_SHA::7}\` on $(date -u '+%Y-%m-%d %H:%M UTC').
          Already installed? The app updates itself: **Control Panel → ⬆ Update**.

          ### 📦 Downloads
          - **Windows 10/11**: \`RetCore-OnLAN-Windows.exe\`
          - **Linux x86_64** (Ubuntu 22.04+ / Debian 12+, X11 desktop): \`RetCore-OnLAN-Linux.tar.gz\`
            \`\`\`bash
            tar -xzf RetCore-OnLAN-Linux.tar.gz && ./RetCore-OnLAN-Linux
            \`\`\`
            Optional extras: \`sudo apt install pulseaudio-utils adb scrcpy uxplay avahi-daemon\`
            (system audio, Android mirroring, iOS AirPlay).
          EOF

      # Delete + recreate so the "latest" tag moves to this commit
      # (re-using an existing tag would keep pointing at the first build).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest release-assets/* \
            --target "$GITHUB_SHA" \
            --title "RetCore OnLAN Latest Release" \
            --notes-file notes.md \
            --latest
